<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmileX Admin</title>
    <!-- 首次加载全屏动画：必须纯静态（bundle 加载前无任何外部资源可用）。
         色值与 src/styles/tokens.css 同源（--sx-ink #151E2B / --sx-accent-bright #8FC5E8），
         改主题两处同步调整。main.ts 在首次导航就绪后挂载应用，并给本层加 .is-done 淡出移除。 -->
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        /* 深藏蓝底 + 中央微光，与登录页 PulseWave 的深底语言一致 */
        background: radial-gradient(ellipse at 50% 42%, #1b2839 0%, #151e2b 68%);
        transition: opacity 0.35s ease;
      }
      #app-loading.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .bl-wave {
        width: min(240px, 64vw);
        height: auto;
        display: block;
      }
      /* 波形描线：三行错峰循环（350 ≥ 全线长约 343）。每行终态透明度用 --bl-o，
         keyframes 里以 var() 引用，各自回填 */
      .bl-wave path {
        fill: none;
        stroke: #8fc5e8;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 350;
        stroke-dashoffset: 350;
      }
      .bl-wave__top    { --bl-o: 0.25; animation: boot-trace 2.8s linear -1.9s infinite; }
      .bl-wave__mid    { --bl-o: 0.9;  animation: boot-trace 2.8s linear -0.3s infinite; }
      .bl-wave__bottom { --bl-o: 0.5;  animation: boot-trace 2.8s linear -1.1s infinite; }
      @keyframes boot-trace {
        0%   { stroke-dashoffset: 350; opacity: 0; }
        10%  { opacity: var(--bl-o); }
        55%  { stroke-dashoffset: 0; opacity: var(--bl-o); }
        82%  { stroke-dashoffset: 0; opacity: var(--bl-o); }
        94%  { stroke-dashoffset: 0; opacity: 0; }
        100% { stroke-dashoffset: 350; opacity: 0; }
      }
      /* 光点：SMIL 沿中间波形巡游（勿在 CSS 设 opacity——CSS 会压过 SMIL 动画值） */
      .bl-dot {
        fill: #cfe7f8;
        filter: drop-shadow(0 0 5px rgba(143, 197, 232, 0.9));
      }
      .bl-brand {
        margin: 0;
        font: 500 12px/1 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', sans-serif;
        letter-spacing: 0.32em;
        text-indent: 0.32em; /* 抵消末字符 letter-spacing，视觉居中 */
        color: #8fa3bc;
        opacity: 0;
        animation: boot-brand 0.9s ease 0.5s forwards;
      }
      @keyframes boot-brand {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: none; }
      }
      /* 降级：tokens.css 的全局减弱动效规则此时尚未加载到，本层自带一份 */
      @media (prefers-reduced-motion: reduce) {
        .bl-wave path {
          animation: none;
          stroke-dashoffset: 0; /* 静态满波形 */
        }
        .bl-dot { display: none; }
        .bl-brand { animation: none; opacity: 1; transform: none; }
      }
      .bl-noscript {
        margin: 0;
        color: #8fa3bc;
        font: 400 13px/1.6 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-loading" role="status" aria-label="加载中">
      <svg class="bl-wave" viewBox="0 0 240 96" aria-hidden="true">
        <path class="bl-wave__top" d="M0 20 H20 L30 6 L40 34 L50 20 H84 L94 6 L104 34 L114 20 H148 L158 6 L168 34 L178 20 H240" />
        <path class="bl-wave__mid" id="bl-mid-path" d="M0 48 H20 L30 34 L40 62 L50 48 H84 L94 34 L104 62 L114 48 H148 L158 34 L168 62 L178 48 H240" />
        <path class="bl-wave__bottom" d="M0 76 H20 L30 62 L40 90 L50 76 H84 L94 62 L104 90 L114 76 H148 L158 62 L168 90 L178 76 H240" />
        <circle class="bl-dot" r="3.2" opacity="0">
          <animateMotion dur="2.4s" repeatCount="indefinite">
            <mpath href="#bl-mid-path" />
          </animateMotion>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="2.4s" repeatCount="indefinite" />
        </circle>
      </svg>
      <p class="bl-brand">SmileX Admin</p>
      <noscript><p class="bl-noscript">需要启用 JavaScript 才能使用 SmileX Admin</p></noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
